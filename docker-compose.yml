services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: recruiting-rag-postgres
    environment:
      POSTGRES_DB: recruiting_rag
      POSTGRES_USER: recruiting_rag
      POSTGRES_PASSWORD: recruiting_rag
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: recruiting-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
