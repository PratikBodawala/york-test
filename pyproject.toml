[project]
name = "york-recruiting-rag-poc"
version = "0.1.0"
description = "Recruiting RAG proof of concept built with Django, Celery, Redis, Postgres, and LangChain."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.5.3",
    "Django>=5.2.1",
    "filetype>=1.2.0",
    "langchain>=0.3.27",
    "langchain-openai>=0.3.18",
    "langchain-postgres>=0.0.15",
    "langchain-text-splitters>=0.3.9",
    "psycopg[binary]>=3.2.9",
    "pypdf>=5.5.0",
    "python-docx>=1.1.2",
    "redis>=6.0.0",
    "python-dotenv==1.2.2"
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
